name: Build, Migrate, and Deploy

on:
  push:
    branches:
      - main
      - 'ui/**'
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # GitHub Pages permits only one active deployment for the environment.
  # Serialize main deployments across commits instead of giving every SHA its own group.
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'pages-main' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  freshness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check this is the latest main commit
        id: check
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale main run for $GITHUB_SHA; latest main is $latest_sha."
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.freshness.outputs.current == 'true'
    needs:
      - freshness
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: gnhmfhvvirpgawijsrej
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Reconcile remote-applied migration history in checkout
        run: python3 scripts/reconcile_remote_migrations.py

      - name: Preview pending migrations
        run: supabase db push --include-all --dry-run

      - name: Apply pending migrations
        run: supabase db push --include-all

      - name: Deploy SAT source proxy
        run: supabase functions deploy sat-question-source --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Verify migration history is deployable
        run: |
          supabase migration list
          supabase db push --include-all --dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.freshness.outputs.current == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - build
      - migrate
      - freshness
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Sync applied Supabase migrations to main

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - Build, Migrate, and Deploy
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-applied-migrations
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: gnhmfhvvirpgawijsrej
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Link Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Collect applied migration SQL from source branches
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "sync/applied-migrations-${GITHUB_RUN_ID}"
          python3 scripts/sync_applied_migrations.py
          if git rev-parse HEAD^ >/dev/null 2>&1 && [ "$(git log -1 --format=%s)" = "chore: synchronize already-applied Supabase migrations" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Propose migration-only patch to main
        if: steps.reconcile.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push origin "HEAD:sync/applied-migrations-${GITHUB_RUN_ID}"
          url="$(gh pr create --base main --head "sync/applied-migrations-${GITHUB_RUN_ID}" --title 'chore: sync applied Supabase migrations' --body 'Original SQL files for migrations already recorded as applied in Supabase. No remote migration history or feature code is modified.')"
          echo "Created migration-only PR: $url"
          # Auto-merge only when branch protection and repository settings permit.
          gh pr merge "$url" --auto --squash --delete-branch || echo "::warning::Auto-merge unavailable. Review and merge the migration-only PR."

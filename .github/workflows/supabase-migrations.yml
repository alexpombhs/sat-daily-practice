name: Manual Supabase migration recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: gnhmfhvvirpgawijsrej
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview pending migrations
        run: supabase db push --include-all --dry-run
      - name: Apply pending migrations
        run: supabase db push --include-all
      - name: Deploy SAT source proxy
        run: supabase functions deploy sat-question-source --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Verify migration history
        run: |
          supabase migration list
          supabase db push --include-all --dry-run
